# Proxy of /api/ to the backend, included by every location that serves the API in both server templates
# (default.conf.template and tls.conf.template); nginx/Dockerfile copies it to /etc/nginx/snippets/.
proxy_pass http://backend:8000;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# Always the scheme of this server ("http" or "https"), whatever the client sent: the backend sets the cookie Secure
# from it
proxy_set_header X-Forwarded-Proto $scheme;
