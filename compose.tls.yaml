# HTTPS override (REQ-002): docker compose -f compose.yaml -f compose.tls.yaml up --build
# Publishes HTTPS_PORT (default 443) and passes it to Nginx, which answers HTTPS only with this file and with
# cert.pem and key.pem in nginx/certs/, then redirects HTTP to https on that port; otherwise it stays HTTP only.
services:
  nginx:
    ports:
      - "${HTTPS_PORT:-443}:443"
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-443}
