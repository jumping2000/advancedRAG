# advancedRAG stack: docker compose up --build (values from .env, see .env.example)
name: advancedrag
# What the backend and the worker both read. The worker gets nothing else of the backend's (least privilege): the admin
# account, the sessions, the upload limit and the health timeout are the backend's; the Docling key, the attempts, the
# minimum text and the retention of the FAILED originals are the worker's (see the `worker` service).
x-common-environment: &common-environment
  DATABASE_URL: postgresql+asyncpg://rag@db:5432/ragdb
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  REDIS_URL: redis://redis:6379/0
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:?set OLLAMA_BASE_URL in .env}
  DOCLING_BASE_URL: ${DOCLING_BASE_URL:?set DOCLING_BASE_URL in .env}
  # Fixed here: the folder is the `uploads` volume, so .env cannot point it elsewhere
  UPLOAD_DIR: /data/uploads
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
  EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-120}
  CHUNK_TARGET_WORDS: ${CHUNK_TARGET_WORDS:-300}
  CHUNK_MIN_WORDS: ${CHUNK_MIN_WORDS:-50}
  CHUNK_MAX_WORDS: ${CHUNK_MAX_WORDS:-450}
  CHUNK_OVERLAP_PERCENT: ${CHUNK_OVERLAP_PERCENT:-15}

services:
  db:
    image: paradedb/paradedb:0.26.4-pg17
    environment:
      POSTGRES_USER: rag
      POSTGRES_DB: ragdb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rag -d ragdb && PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U rag -d ragdb -tAc 'select 1'"]
      interval: 3s
      timeout: 5s
      retries: 40

  redis:
    image: redis:7.4.12-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    # The worker runs this same image: it is built once, here
    image: advancedrag-backend
    environment:
      <<: *common-environment
      HEALTH_CHECK_TIMEOUT_SECONDS: ${HEALTH_CHECK_TIMEOUT_SECONDS:-2}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-480}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}
      # The generation provider of the chat (phase 3): only the backend calls it, the worker does not get these
      GENERATION_BASE_URL: ${GENERATION_BASE_URL:-}
      GENERATION_MODEL: ${GENERATION_MODEL:-}
      GENERATION_API_KEY: ${GENERATION_API_KEY:-}
      GENERATION_TIMEOUT_SECONDS: ${GENERATION_TIMEOUT_SECONDS:-300}
      # Retrieval and context of the chat: only the backend answers questions
      RETRIEVAL_CANDIDATES: ${RETRIEVAL_CANDIDATES:-50}
      RRF_K: ${RRF_K:-60}
      CHAT_CONTEXT_CHUNKS: ${CHAT_CONTEXT_CHUNKS:-8}
      CHAT_HISTORY_MESSAGES: ${CHAT_HISTORY_MESSAGES:-6}
      CHAT_MAX_QUESTION_CHARS: ${CHAT_MAX_QUESTION_CHARS:-4000}
      # The question rewriting and the reranker (phase 4): only the backend calls them, the worker does not get these
      REWRITE_BASE_URL: ${REWRITE_BASE_URL:-}
      REWRITE_MODEL: ${REWRITE_MODEL:-}
      REWRITE_API_KEY: ${REWRITE_API_KEY:-}
      REWRITE_TIMEOUT_SECONDS: ${REWRITE_TIMEOUT_SECONDS:-30}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      RERANK_API: ${RERANK_API:-tei}
      RERANK_MODEL: ${RERANK_MODEL:-}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_CANDIDATES: ${RERANK_CANDIDATES:-20}
      RERANK_TIMEOUT_SECONDS: ${RERANK_TIMEOUT_SECONDS:-15}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=10)"]
      interval: 5s
      timeout: 12s
      retries: 30

  # The ingestion worker: the image of the backend, the RQ queue `ingestion`, one job at a time. It shares the `uploads`
  # volume with the backend and publishes no port; it waits for the backend, which applies the migrations.
  worker:
    image: advancedrag-backend
    # Built by the `backend` service, which the worker waits for: never pulled
    pull_policy: never
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *common-environment
      # Only the worker calls Docling to convert a file and repeats a step: the backend does not get these
      DOCLING_API_KEY: ${DOCLING_API_KEY:-}
      DOCLING_TIMEOUT_SECONDS: ${DOCLING_TIMEOUT_SECONDS:-600}
      DOCLING_INCLUDE_IMAGES: ${DOCLING_INCLUDE_IMAGES:-false}
      INGESTION_MAX_ATTEMPTS: ${INGESTION_MAX_ATTEMPTS:-3}
      INGESTION_RETRY_BACKOFF_SECONDS: ${INGESTION_RETRY_BACKOFF_SECONDS:-10}
      MIN_EXTRACTED_CHARS: ${MIN_EXTRACTED_CHARS:-50}
      # Only the worker deletes the originals of the FAILED documents, at its start and every hour
      FAILED_ORIGINAL_RETENTION_DAYS: ${FAILED_ORIGINAL_RETENTION_DAYS:-7}
    # A stop (SIGTERM) lets the job in progress finish for this long; a longer job is killed and its document is made
    # FAILED "Processing was interrupted" by the next start
    stop_grace_period: 120s
    volumes:
      - uploads:/data/uploads
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 5s
      timeout: 15s
      retries: 30

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "${HTTP_PORT:-80}:80"
    environment:
      # Nginx lets the upload route take a body of this limit plus 1 MB (see nginx/entrypoint-tls.sh)
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || wget -q --no-check-certificate -O /dev/null https://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The reranker (phase 4, ADR-004), optional: only with `docker compose --profile rerank up --build`; on a NVIDIA GPU
  # also `-f compose.rerank-gpu.yaml`, which replaces the image (one reranker at a time). Hugging Face
  # text-embeddings-inference on port 80 of the Compose network, never published on the host: the backend reaches it at
  # RERANK_BASE_URL=http://reranker (RERANK_API=tei). The model is downloaded from Hugging Face at the first start into
  # the `reranker-models` volume; until then the service is not healthy and the chat keeps the RRF order.
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    profiles: ["rerank"]
    environment:
      MODEL_ID: ${RERANK_COMPOSE_MODEL:-BAAI/bge-reranker-v2-m3}
    volumes:
      - reranker-models:/data
    healthcheck:
      # The image has curl; the first start waits for the download of the model (start_period)
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30m

volumes:
  pgdata:
  uploads:
  reranker-models:
