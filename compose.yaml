# advancedRAG stack: docker compose up --build (values from .env, see .env.example)
name: advancedrag
# What the backend and the worker both read. The worker gets nothing else of the backend's (least privilege): the admin
# account, the sessions, the upload limit and the health timeout are the backend's; the Docling key, the attempts and
# the minimum text are the worker's (see the `worker` service).
x-common-environment: &common-environment
  DATABASE_URL: postgresql+asyncpg://rag@db:5432/ragdb
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  REDIS_URL: redis://redis:6379/0
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:?set OLLAMA_BASE_URL in .env}
  DOCLING_BASE_URL: ${DOCLING_BASE_URL:?set DOCLING_BASE_URL in .env}
  # Fixed here: the folder is the `uploads` volume, so .env cannot point it elsewhere
  UPLOAD_DIR: /data/uploads
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
  EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-120}
  CHUNK_TARGET_WORDS: ${CHUNK_TARGET_WORDS:-300}
  CHUNK_MIN_WORDS: ${CHUNK_MIN_WORDS:-50}
  CHUNK_MAX_WORDS: ${CHUNK_MAX_WORDS:-450}
  CHUNK_OVERLAP_PERCENT: ${CHUNK_OVERLAP_PERCENT:-15}

services:
  db:
    image: paradedb/paradedb:0.26.4-pg17
    environment:
      POSTGRES_USER: rag
      POSTGRES_DB: ragdb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rag -d ragdb && PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U rag -d ragdb -tAc 'select 1'"]
      interval: 3s
      timeout: 5s
      retries: 40

  redis:
    image: redis:7.4.12-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    # The worker runs this same image: it is built once, here
    image: advancedrag-backend
    environment:
      <<: *common-environment
      HEALTH_CHECK_TIMEOUT_SECONDS: ${HEALTH_CHECK_TIMEOUT_SECONDS:-2}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-480}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=10)"]
      interval: 5s
      timeout: 12s
      retries: 30

  # The ingestion worker: the image of the backend, the RQ queue `ingestion`, one job at a time. It shares the `uploads`
  # volume with the backend and publishes no port; it waits for the backend, which applies the migrations.
  worker:
    image: advancedrag-backend
    # Built by the `backend` service, which the worker waits for: never pulled
    pull_policy: never
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *common-environment
      # Only the worker calls Docling to convert a file and repeats a step: the backend does not get these
      DOCLING_API_KEY: ${DOCLING_API_KEY:-}
      DOCLING_TIMEOUT_SECONDS: ${DOCLING_TIMEOUT_SECONDS:-600}
      DOCLING_INCLUDE_IMAGES: ${DOCLING_INCLUDE_IMAGES:-false}
      INGESTION_MAX_ATTEMPTS: ${INGESTION_MAX_ATTEMPTS:-3}
      INGESTION_RETRY_BACKOFF_SECONDS: ${INGESTION_RETRY_BACKOFF_SECONDS:-10}
      MIN_EXTRACTED_CHARS: ${MIN_EXTRACTED_CHARS:-50}
    volumes:
      - uploads:/data/uploads
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 5s
      timeout: 15s
      retries: 30

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "${HTTP_PORT:-80}:80"
    environment:
      # Nginx lets the upload route take a body of this limit plus 1 MB (see nginx/entrypoint-tls.sh)
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || wget -q --no-check-certificate -O /dev/null https://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  uploads:
