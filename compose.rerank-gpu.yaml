# Reranker on a NVIDIA GPU (REQ-013, ADR-004):
#   docker compose -f compose.yaml -f compose.rerank-gpu.yaml --profile rerank up --build
# It replaces the CPU image of the `reranker` service of compose.yaml and reserves one GPU, so only one reranker image
# runs; without this file the CPU start pulls no GPU image. NVIDIA GPUs only, on x86_64 hosts with the NVIDIA Container
# Toolkit. This image (compute capability 8.0) serves Ampere (A100, A30, A10, A40, RTX 30xx) and Ada Lovelace
# (RTX 40xx, L4, L40). The per-family tags of the same release also exist (86-1.9.4 for Ampere 8.6, 89-1.9.4 for Ada);
# Turing, Hopper and Blackwell need their own tag from the table of the text-embeddings-inference README (turing-1.9.4,
# hopper-1.9.4, 100-1.9.4, 120-1.9.4). Older GPUs (Volta, Pascal) and ARM hosts are not covered.
services:
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:1.9.4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
