# Runs the project's definition of "done" (scripts/verify.py) on every PR, on a clean machine.
name: verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --project backend --frozen
      # Chromium for the Playwright end-to-end tests of the UI (e2e step of verify)
      - run: uv run --frozen --directory backend playwright install --with-deps chromium
      - run: npm ci --prefix frontend
      - run: python scripts/verify.py
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-reports
          path: reports/
          if-no-files-found: ignore
